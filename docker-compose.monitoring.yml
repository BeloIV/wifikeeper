services:
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - container-stats-textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"

  container-stats:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - container-stats-textfile:/textfile
      - ./monitoring/container-stats/export.sh:/export.sh:ro
    entrypoint: ["/bin/sh", "/export.sh"]

  # Reálne interné štatistiky FreeRADIUS (latencia, retransmisie od AP).
  # Dotazuje sa cez `docker exec` na status socket, ktorý počúva len na
  # 127.0.0.1 vnútri freeradius kontajnera — nič nie je exponované navonok.
  radius-stats:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - container-stats-textfile:/textfile
      - ./monitoring/container-stats/radius-stats.sh:/radius-stats.sh:ro
    entrypoint: ["/bin/sh", "/radius-stats.sh"]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}:${EMAIL_PORT:-587}
      GF_SMTP_USER: ${BREVO_SMTP_USER}
      GF_SMTP_PASSWORD: ${BREVO_SMTP_KEY}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM:-no-reply@oratko.sk}
      GF_SMTP_FROM_NAME: "WiFi Monitor"
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wifimanager}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/wifikeeper-overview.json
      PUSH_WEBHOOK_SECRET: ${PUSH_WEBHOOK_SECRET}
    depends_on:
      loki:
        condition: service_healthy

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  container-stats-textfile:

networks:
  default:
    name: wifikeeper_default
    external: true
