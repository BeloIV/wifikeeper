events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format detailed '$remote_addr - [$time_local] "$request" '
                        'status=$status bytes=$body_bytes_sent host=$host '
                        'rt=$request_time uaddr=$upstream_addr ustatus=$upstream_status '
                        'referer="$http_referer" ua="$http_user_agent"';
    access_log /dev/stdout detailed;

    # Docker DNS resolver — dynamické re-resolvovanie service names.
    # Funguje len ak je proxy_pass cieľ premenná (inak nginx IP zacachuje pri štarte
    # a po recreate kontajnera padá s "connect() failed" kým sa nginx nereštartuje).
    resolver 127.0.0.11 valid=10s;

    # Presmerovanie HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        # Self-signed certifikát (generovaný skriptom scripts/gen-self-signed.sh)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        set $backend_upstream http://backend:8000;
        set $frontend_upstream http://frontend:3006;

        # ── API → Django backend ──────────────────────────────────────────────
        location /api/ {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pre Django admin CSRF
            proxy_set_header X-Forwarded-Host $host;
        }

        location /admin/ {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass $backend_upstream;
        }

        # ── Frontend → Next.js ────────────────────────────────────────────────
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket pre Next.js hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
