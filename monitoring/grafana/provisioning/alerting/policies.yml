apiVersion: 1

policies:
  - orgId: 1
    receiver: email-admin
    group_by: [alertname, service]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Nginx 4xx/5xx – len push, bez emailu (obe majú label service=nginx,
      # žiadny iný alert toto service nepoužíva)
      - receiver: push-only
        object_matchers:
          - [service, "=", nginx]
        continue: false
