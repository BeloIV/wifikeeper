apiVersion: 1

# Zmazanie starého alertu, ktorý bol postavený na linelog AUTH_LATENCY prístupe.
# Ten sme vrátili späť (zasahoval do živej auth politiky), takže pravidlo by
# navždy viselo v stave NoData. Provisioned pravidlá sa nedajú zmazať cez API,
# len takto.
deleteRules:
  - orgId: 1
    uid: radius-latency-high


groups:
  - orgId: 1
    name: wifikeeper-alerts
    folder: WifiKeeper
    interval: 5m
    rules:

      - uid: celery-error
        title: "Celery: ERROR v logoch"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Celery worker zaznamenal ERROR"
          description: "Skontroluj logy: docker compose logs celery --tail=50"
        labels:
          severity: critical
          service: celery
        data:
          - refId: A
            datasourceUid: loki
            queryType: range
            model:
              expr: 'sum(count_over_time({service="celery"} |= "ERROR" [5m]))'
              queryType: range
              refId: A
            relativeTimeRange:
              from: 300
              to: 0

      - uid: celery-email-fail
        title: "Celery: zlyhanie odosielania emailu"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Email sa nepodarilo odoslať"
          description: "Celery task send_*_email zlyhal. Skontroluj SMTP credentials a FD limit."
        labels:
          severity: critical
          service: celery
        data:
          - refId: A
            datasourceUid: loki
            queryType: range
            model:
              expr: 'sum(count_over_time({service="celery"} |= "Chyba pri odosielaní" [5m]))'
              queryType: range
              refId: A
            relativeTimeRange:
              from: 300
              to: 0

      - uid: celery-fd-limit
        title: "Celery: Too many open files"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Celery dosiahol limit file descriptorov"
          description: "Reštartuj celery container: docker compose restart celery"
        labels:
          severity: critical
          service: celery
        data:
          - refId: A
            datasourceUid: loki
            queryType: range
            model:
              expr: 'sum(count_over_time({service="celery"} |= "Too many open files" [5m]))'
              queryType: range
              refId: A
            relativeTimeRange:
              from: 300
              to: 0

  - orgId: 1
    name: wifikeeper-infra-alerts
    folder: WifiKeeper
    interval: 1m
    rules:

      - uid: container-down
        title: "Kontajner nebeží"
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Kontajner {{ $labels.name }} nie je spustený"
          description: "Stav: {{ $labels.state }}. Skontroluj: docker compose ps {{ $labels.name }}; docker compose logs {{ $labels.name }} --tail=50"
        labels:
          severity: critical
          service: "{{ $labels.name }}"
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: 'wifikeeper_container_up == 0'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: nginx-5xx
        title: "Nginx: 5xx chyby"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Nginx vrátil 5xx chyby (status {{ $labels.status }}, host {{ $labels.host }})"
          description: "Skontroluj logy: docker compose logs nginx --tail=100 | grep 'status=5'"
        labels:
          severity: critical
          service: nginx
        data:
          - refId: A
            datasourceUid: loki
            queryType: instant
            model:
              expr: 'sum by (status, host) (count_over_time({service="nginx"} | regexp `status=(?P<status>\d+) bytes=(?P<bytes>\d+) host=(?P<host>\S+)` | status >= 500 [5m])) > 0'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: nginx-4xx-burst
        title: "Nginx: 4xx chyby"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Nginx vrátil 4xx chybu (status {{ $labels.status }}, host {{ $labels.host }})"
          description: "Skontroluj logy: docker compose logs nginx --tail=100 | grep 'status=4'"
        labels:
          severity: warning
          service: nginx
        data:
          - refId: A
            datasourceUid: loki
            queryType: instant
            model:
              expr: 'sum by (status, host) (count_over_time({service="nginx"} | regexp `status=(?P<status>\d+) bytes=(?P<bytes>\d+) host=(?P<host>\S+)` | status >= 400 | status < 500 [5m])) > 0'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: cpu-high
        title: "Server: vysoké CPU využitie"
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "CPU využitie servera je vysoké"
          description: "Skontroluj Grafana dashboard 'WifiKeeper Infraštruktúra' a `docker stats`, ktorý kontajner zaťažuje CPU."
        labels:
          severity: warning
          service: server
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: '(100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: memory-high
        title: "Server: vysoké využitie RAM"
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Využitie RAM servera je vysoké"
          description: "Skontroluj Grafana dashboard 'WifiKeeper Infraštruktúra' a `docker stats`, ktorý kontajner zaberá najviac pamäte."
        labels:
          severity: warning
          service: server
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: '((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100) > 85'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: disk-high
        title: "Server: vysoké využitie disku"
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Využitie disku (/) servera je vysoké"
          description: "Skontroluj voľné miesto: df -h. Zváž vyčistenie starých logov/backupov."
        labels:
          severity: warning
          service: server
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: '(100 - (node_filesystem_avail_bytes{mountpoint="/"} * 100 / node_filesystem_size_bytes{mountpoint="/"})) > 85'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 60
              to: 0

      - uid: radius-slow-response
        title: "RADIUS: pomalá odpoveď reálnym používateľom (>1s)"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "FreeRADIUS spracoval request pomalšie ako 1 sekundu"
          description: "Zdroj: interné štatistiky FreeRADIUS (Stats-Elapsed), teda reálna prevádzka. Bežná hodnota je pod 10 ms. Skontroluj docker stats a docker compose logs freeradius --tail=50."
        labels:
          severity: warning
          service: freeradius
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: 'sum(increase(wifikeeper_radius_latency_bucket_total{bucket=~"1s|10s"}[5m])) > 0'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 300
              to: 0

      - uid: radius-retransmissions
        title: "RADIUS: AP nedostáva odpovede (retransmisie)"
        condition: A
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "UniFi AP musel poslať RADIUS request znova — server neodpovedal včas"
          description: "Presne ten príznak, ktorý hlási UniFi ako 'server neodpovedá'. Skontroluj zaťaženie servera a docker compose logs freeradius."
        labels:
          severity: critical
          service: freeradius
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: 'sum(increase(wifikeeper_radius_auth_duplicate_requests_total[5m])) > 0'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 300
              to: 0

      - uid: radius-stats-down
        title: "RADIUS: monitoring štatistík nefunguje"
        condition: A
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Nedá sa čítať zo Status-Server socketu FreeRADIUS"
          description: "Monitoring RADIUS latencie je slepý. Skontroluj: docker compose -f docker-compose.monitoring.yml logs radius-stats"
        labels:
          severity: warning
          service: freeradius
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: instant
            model:
              expr: '(wifikeeper_radius_stats_up < 1) or absent_over_time(wifikeeper_radius_stats_up[10m])'
              queryType: instant
              refId: A
            relativeTimeRange:
              from: 600
              to: 0
